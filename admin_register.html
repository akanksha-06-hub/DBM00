<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Register — SmartCity</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
.register-card{
background:rgba(10,22,40,0.75);
border-radius:16px;
padding:40px;
max-width:520px;
margin:auto;
margin-top:80px;
}

.form-group{margin-bottom:16px}

.form-input{
width:100%;
padding:12px;
border-radius:6px;
border:1px solid #444;
background:#0a0e1a;
color:white;
}

.btn-admin-register{
width:100%;
padding:14px;
border:none;
background:linear-gradient(135deg,#7C3AED,#6366F1);
color:white;
font-weight:bold;
border-radius:6px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="register-card">

<h2 style="text-align:center;">Admin Registration</h2>

<form action="/admin_register" method="POST">

<div class="form-group">
<label>Admin Name</label>
<input type="text" name="name" class="form-input" required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" name="email" class="form-input" required>
</div>

<div class="form-group">
<label>Phone</label>
<input type="text" name="phone" class="form-input" required>
</div>

<div class="form-group">
<label>Username</label>
<input type="text" name="username" class="form-input" required>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" name="password" class="form-input" required>
</div>

<div class="form-group">
<label>Admin Role</label>
<select name="role" class="form-input">
<option value="superadmin">Super Admin</option>
<option value="citymanager">Staff</option>
</select>
</div>

<button type="submit" class="btn-admin-register">
<i class="fas fa-user-shield"></i> Register Admin
</button>

</form>

<br>

<div style="text-align:center">
Already have admin account?
<a href="{{ url_for('admin_login') }}">Login</a>
</div>

</div>

</body>
</html>
